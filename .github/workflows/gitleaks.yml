name: Gitleaks Secret Scan

# DISABLED: Gitleaks requires a paid license for organizations.
# To re-enable: get a license at gitleaks.io, store as GITHUB Secret GITLEAKS_LICENSE,
# then remove the `if: false` line below.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"   # daily at 4 AM UTC

jobs:
  gitleaks:
    if: false  # disabled — missing GITLEAKS_LICENSE
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
