name: Gitleaks Secret Scanning
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (free OSS via Docker)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo zricethezav/gitleaks:latest \
            detect --source . --no-banner --redact --config .gitleaks.toml