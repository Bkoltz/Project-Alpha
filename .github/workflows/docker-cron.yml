1|name: Docker Cron
2|
3|on:
4|  push:
5|    branches: [ "main" ]
6|    paths:
7|      - 'cron/**'
8|      - '.github/workflows/docker-cron.yml'
9|  pull_request:
10|    branches: [ "main" ]
11|    paths:
12|      - 'cron/**'
13|      - '.github/workflows/docker-cron.yml'
14|
15|env:
16|  REGISTRY: docker.io
17|  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/project-alpha
18|
19|jobs:
20|  build-cron:
    if: false  # disabled — Docker Hub credentials need updating
21|    runs-on: ubuntu-latest
22|    permissions:
23|      contents: read
24|      packages: write
25|      id-token: write
26|
27|    steps:
28|      - name: Checkout repository
29|        uses: actions/checkout@v4
30|
31|      - name: Install cosign
32|        if: github.event_name != 'pull_request'
33|        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 #v3.5.0
34|        with:
35|          cosign-release: 'v2.2.4'
36|
37|      - name: Set up Docker Buildx
38|        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226
39|
40|      - name: Log into Docker Hub
41|        if: github.event_name != 'pull_request'
42|        uses: docker/login-action@v3
43|        with:
44|          registry: docker.io
45|          username: ${{ secrets.DOCKER_HUB_USERNAME }}
46|          password: ${{ secrets.DOCKER_HUB_TOKEN }}
47|
48|      - name: Extract Docker metadata
49|        id: meta
50|        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
51|        with:
52|          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
53|          tags: |
54|            type=raw,value=cron,enable=${{ github.ref == 'refs/heads/main' }}
55|
56|      - name: Build and push cron Docker image
57|        id: build-and-push
58|        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
59|        with:
60|          context: ./cron
61|          push: ${{ github.event_name != 'pull_request' }}
62|          tags: ${{ steps.meta.outputs.tags }}
63|          labels: ${{ steps.meta.outputs.labels }}
64|          cache-from: type=gha
65|          cache-to: type=gha,mode=max
66|
67|      - name: Sign the published Docker image
68|        if: github.event_name != 'pull_request'
69|        env:
70|          TAGS: ${{ steps.meta.outputs.tags }}
71|          DIGEST: ${{ steps.build-and-push.outputs.digest }}
72|        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
73|