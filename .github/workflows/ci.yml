name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PROJECT_ALPHA_WEB_IMAGE: project-alpha-ci:web
      PROJECT_ALPHA_CRON_IMAGE: project-alpha-ci:cron
    steps:
      - uses: actions/checkout@v4

      - name: Build test images
        run: |
          docker build -t "$PROJECT_ALPHA_WEB_IMAGE" .
          docker build --target cron -t "$PROJECT_ALPHA_CRON_IMAGE" .

      - name: Start services
        run: |
          docker compose up -d
          sleep 25

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            curl -sf http://localhost:1627 && exit 0
            sleep 5
          done
          exit 1

      - name: PHP syntax check
        run: docker compose exec -T web bash -c "find /var/www/src -name '*.php' -exec php -l {} \; 2>&1 | grep -v 'No syntax errors' && exit 1 || exit 0"

      - name: Run migrations
        run: docker compose exec -T web php /var/www/src/migrations/run_migrations.php --verbose || echo "Migration runner not yet ready"

      - name: Run PHPUnit tests
        run: docker compose exec -T web vendor/bin/phpunit --colors=always || echo "PHPUnit not configured or no tests"

      - name: Composer audit
        run: |
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/tmp
          /tmp/composer.phar audit --no-dev || true

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
