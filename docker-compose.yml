# Project Alpha — Docker Compose
#
# DEPLOYMENT:
#   1. Edit the passwords/keys below (search for "CHANGE THESE")
#   2. Run: docker compose up -d --build
#   3. Open http://localhost:1627
#   4. Log in with admin@project-alpha.local / <your ADMIN_PASSWORD>
#   5. Go to Settings > Billing to enter Stripe keys (encrypted in DB)
#
# NO .env FILE NEEDED — all config is inline below.
# Stripe/SMTP keys are entered via the app UI and stored encrypted in the DB.
#
# If you DO have a .env file, it still works (values are used as defaults
# via the ${VAR:-default} syntax), but it's no longer required.

services:
  web:
    build: .
    image: "bkoltz/project-alpha:latest"
    ports:
      - "1627:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      # CHANGE THESE — use env vars from .env if present, otherwise use inline defaults
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_secure_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_pass}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme_admin_pass}
      # Encryption key for secrets (Stripe keys, SMTP password, etc.)
      # If not set, the web container auto-generates one and persists it
      # in the config volume for stability across restarts.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      # Stripe keys entered via Settings > Billing UI (stored encrypted in DB)
      # These env-vars are optional fallbacks only
      stripe_publishable_key: ${stripe_publishable_key:-}
      stripe_secret_key_enc: ${stripe_secret_key_enc:-}
      stripe_webhook_secret_enc: ${stripe_webhook_secret_enc:-}
      APP_AUTH_DISABLED: ${APP_AUTH_DISABLED:-false}
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\")!==false?0:1);'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./src:/var/www/src
      - ./src/uploads:/var/www/src/uploads
      - ./config:/var/www/config
      - ./backups:/var/www/backups

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    image: "bkoltz/project-alpha:cron"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_secure_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_pass}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/var/www/src
      - ./src/uploads:/var/www/src/uploads
      - ./config:/var/www/config
      - ./backups:/var/www/backups
      - cron_logs:/var/log/cron

  db:
    image: "mysql:8"
    restart: unless-stopped
    command: >
      --log-error-verbosity=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_secure_pass}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

volumes:
  db_data: {}
  db_keyring: {}
  cron_logs: {}