# TODO: Set ADMIN_PASSWORD environment variable before running docker-compose up
services:
  web:
    build: .
    image: "bkoltz/project-alpha:latest"
    ports:
      - "1627:80"
    environment:
      MYSQL_DATABASE: project_alpha
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpass
      ADMIN_PASSWORD: admin123
      APP_AUTH_DISABLED: true
      # APP_HOST: your-domain.com
      # SECURITY_HEADERS: true
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\")!==false?0:1);'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./src:/var/www/src 
      - ./src/uploads:/var/www/src/uploads
      - ./config:/var/www/config
  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    image: "bkoltz/project-alpha:cron"
    environment:
      MYSQL_DATABASE: project_alpha
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
      MYSQL_ROOT_PASSWORD: rootpass
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src/uploads:/var/www/src/uploads
      - ./config:/var/www/config
      - cron_logs:/var/log/cron
  db:
    image: "mysql:8"
    restart: unless-stopped
    command: --log-error-verbosity=1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: project_alpha
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    ports:
      - 3307:3306
volumes:
  db_data: {}
  cron_logs: {}