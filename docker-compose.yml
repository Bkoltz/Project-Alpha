# TODO: Copy .env.example to .env and fill in real values before docker compose up
# All credentials live in .env (gitignored) — nothing sensitive is committed.
services:
  web:
    build: .
    image: "bkoltz/project-alpha:latest"
    ports:
      - "1627:80"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      # Dev convenience ONLY — never set to true in production
      APP_AUTH_DISABLED: ${APP_AUTH_DISABLED:-false}
      # APP_HOST: your-domain.com
      # SECURITY_HEADERS: true
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://127.0.0.1/\")!==false?0:1);'"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./src:/var/www/src 
      - ./src/uploads:/var/www/src/uploads
      - ./config:/var/www/config
  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    image: "bkoltz/project-alpha:cron"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src:/var/www/src
      - ./src/uploads:/var/www/src/uploads
      - ./config:/var/www/config
      - cron_logs:/var/log/cron
  db:
    image: "mysql:8"
    restart: unless-stopped
    # Encryption at rest (MySQL 8.4: component_keyring_file via manifest,
    # the legacy keyring_file.so plugin was removed). New tables, redo and
    # undo logs encrypted by default. See docs/ENCRYPTION_AT_REST.md.
    command: >
      --log-error-verbosity=1
      --default-table-encryption=ON
      --innodb-redo-log-encrypt=ON
      --innodb-undo-log-encrypt=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-project_alpha}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - db_keyring:/var/lib/mysql-keyring
      - ./database/mysql/mysqld.my:/usr/sbin/mysqld.my:ro
      - ./database/mysql/component_keyring_file.cnf:/usr/lib64/mysql/plugin/component_keyring_file.cnf:ro
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    # NOTE: no host port mapping — the DB is reachable only on the internal
    # docker network (web/cron connect via db:3306). For local DB inspection,
    # uncomment temporarily or use: docker compose exec db mysql -u appuser -p
    # ports:
    #   - "127.0.0.1:3307:3306"
volumes:
  db_data: {}
  db_keyring: {}
  cron_logs: {}
