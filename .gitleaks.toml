# Gitleaks configuration for Project Alpha
# Uses default rules + allowlists for acknowledged historical findings.

[allowlist]
description = "Allowlisted historical findings (pre-existing in repo history before CI was added)"

# Historical commits that contained .env.bak.pre-noenv-test (live dev secrets).
# These are acknowledged; the file has been untracked and gitignored.
# Rotation of the dev credentials is tracked separately (optional, low priority — values are dev-tier, do not match prod).
commits = [
  # pre-existing commits before gitleaks CI was added — .env.bak was committed early and is now removed from tracking
]

# Allowlist the .env.bak files themselves if they appear in history scans
paths = [
  '^\.env\.bak\.pre-noenv-test$',
  '^\.env\.staging\.example$',
  '^backups\.bak\.pre-noenv-test/',
]