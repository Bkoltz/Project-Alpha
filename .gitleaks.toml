# Gitleaks config for Project Alpha
# Extends the default ruleset; allowlists vendored code and test-only fixtures.
[extend]
useDefault = true

[allowlist]
description = "Vendored third-party code, test-only fixtures, and ACKNOWLEDGED historical findings (pending credential rotation — see .hermes/plans/2026-06-24_pa-credential-rotation-and-history-purge.md)"
paths = [
  '''vendor/''',
  '''.*\.env\.test$''',
  '''.*\.env\.example$''',
]
# Historical commits containing secrets that have been acknowledged. These remain in
# git history until the rotation + history-purge plan is executed. The exposed values
# MUST be treated as compromised and rotated regardless of this allowlist.
