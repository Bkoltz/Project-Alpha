log_errors = On
error_log = /var/www/config/logs/system/error_log.txt
display_errors = Off
error_reporting = E_ALL
; Suppress only consecutive engine messages from the same file and line.
; Distinct messages and the same message from another source remain visible.
ignore_repeated_errors = On
ignore_repeated_source = Off

; Upload and execution limits for tax import (boundary file can be ~300MB)
upload_max_filesize = 500M
post_max_size = 512M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
